# retrodeck — one Flatpak on the live mount. The first run is a wizard at
# the screen (it asks where RetroDECK lives: the home below); everything
# else — the package, the sandbox's reach, the ROM link, the config's path —
# is here and kept.
---
- name: Flathub (system) present
  community.general.flatpak_remote:
    name: "{{ arcade_retrodeck_remote }}"
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present

- name: RetroDECK — one Flatpak, system-wide
  community.general.flatpak:
    name: "{{ arcade_retrodeck_flatpak }}"
    remote: "{{ arcade_retrodeck_remote }}"
    method: system
    state: present

- name: The sandbox reaches its home and the ROMs (a system override, not per user)
  ansible.builtin.command: flatpak override --system --show {{ arcade_retrodeck_flatpak }}
  register: arcade_retrodeck_override
  changed_when: false
  check_mode: false

- name: — granted (home + the ROM cache + the tank state the symlinks resolve to)
  ansible.builtin.command: >-
    flatpak override --system {{ arcade_retrodeck_flatpak }}
    --filesystem={{ arcade_retrodeck_home }} --filesystem={{ arcade_retrodeck_roms }}
    {{ '--filesystem=' ~ arcade_retrodeck_state if arcade_retrodeck_state != '' else '' }}
  when: >-
    arcade_retrodeck_home not in arcade_retrodeck_override.stdout
    or arcade_retrodeck_roms not in arcade_retrodeck_override.stdout
    or (arcade_retrodeck_state != '' and arcade_retrodeck_state not in arcade_retrodeck_override.stdout)

# NB: do NOT pre-create the home dir - RetroDECK nests its own `retrodeck/`
# under an existing path (that is how this install ended up 3 levels deep).
# On a fresh box RetroDECK's Internal option lands at ~/retrodeck by itself;
# we discover wherever it actually put it (above) and never assume the depth.

# --- the irreplaceable, hand-made state lives on the tank (live), the rest
# local. Gated on the home being INITIALISED (the ES-DE dir the first-run
# wizard creates): a pre-wizard converge does nothing, the post-wizard one
# links. Idempotent + handles a non-empty fresh folder (a gamelist template):
# only if the home subfolder is not already a symlink, preserve its content
# onto the tank, remove it, then link. The tank holds the truth after.
# RetroDECK nests its own `retrodeck/` folder(s) under the chosen path, so
# the real home is wherever ES-DE's ROMDirectory points (minus /roms) - the
# only reliable truth. Discover it; pre-wizard (no es_settings.xml) it's
# absent and the state block skips.
- name: ES-DE settings (the wizard has run)?
  ansible.builtin.slurp:
    src: "/var/home/{{ arcade_retrodeck_user }}/.var/app/{{ arcade_retrodeck_flatpak }}/config/ES-DE/settings/es_settings.xml"
  register: arcade_retrodeck_esde
  failed_when: false

- name: The real home = dirname(ES-DE ROMDirectory)
  ansible.builtin.set_fact:
    arcade_retrodeck_rdhome: >-
      {{ ((arcade_retrodeck_esde.content | b64decode
          | regex_search('ROMDirectory\" value=\"([^\"]+)', '\1'))
          | first | dirname) if arcade_retrodeck_esde.content is defined else '' }}

- name: State bits (only once the home is discovered and a state mount is set)
  when: arcade_retrodeck_state != '' and arcade_retrodeck_rdhome != ''
  block:
    - name: The state folders exist on the tank mount
      ansible.builtin.file:
        path: "{{ arcade_retrodeck_state }}/{{ item }}"
        state: directory
      loop: "{{ arcade_retrodeck_state_dirs + ['gamelists'] }}"

    - name: The precious folders live on the tank, symlinked into the home (live)
      ansible.builtin.shell:
        cmd: >-
          h={{ arcade_retrodeck_rdhome | quote }}/{{ item.home }};
          t={{ arcade_retrodeck_state | quote }}/{{ item.tank }};
          if [ -L "$h" ]; then exit 0; fi;
          if [ -d "$h" ]; then rsync -a --ignore-existing "$h"/ "$t"/ && rm -rf "$h"; fi;
          mkdir -p "$(dirname "$h")"; ln -sfn "$t" "$h"; echo LINKED
      register: arcade_retrodeck_linked
      changed_when: "'LINKED' in arcade_retrodeck_linked.stdout"
      loop: >-
        {%- set out = [] -%}
        {%- for d in arcade_retrodeck_state_dirs -%}
        {%-   set _ = out.append({'home': d, 'tank': d}) -%}
        {%- endfor -%}
        {%- set _ = out.append({'home': arcade_retrodeck_gamelists, 'tank': 'gamelists'}) -%}
        {{ out }}
      loop_control: { label: "{{ item.home }}" }

- name: <home>/roms -> the library's local copy (at the discovered home)
  ansible.builtin.file:
    src: "{{ arcade_retrodeck_roms }}"
    dest: "{{ (arcade_retrodeck_rdhome | default('', true)) or arcade_retrodeck_home }}/roms"
    state: link
    force: true
  when: (arcade_retrodeck_rdhome | default('', true)) != ''
  # force-replacing a non-empty roms dir fails safely; the fresh one is empty

- name: Its config (written by the first-run wizard at the screen)
  ansible.builtin.stat:
    path: "/var/home/{{ arcade_retrodeck_user }}/.var/app/{{ arcade_retrodeck_flatpak }}/config/retrodeck/retrodeck.cfg"
  register: arcade_retrodeck_cfg

- name: — keeps pointing at the home
  ansible.builtin.lineinfile:
    path: "{{ arcade_retrodeck_cfg.stat.path }}"
    regexp: "^rdhome="
    line: "rdhome={{ arcade_retrodeck_home }}"
  when: arcade_retrodeck_cfg.stat.exists

- name: — or the wizard is still due
  ansible.builtin.debug:
    msg: "first run pending: launch RetroDECK, choose the INTERNAL/default location (lands at {{ arcade_retrodeck_home }}, local NVMe), add RetroDECK to Steam from its Configurator, then converge again to symlink the state to the tank"
  when: not arcade_retrodeck_cfg.stat.exists
