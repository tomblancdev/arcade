# wolf — the seat engine on a minimal host. Order: refuse the wrong OS →
# the card can exist (firmware, modules) → a container engine with a socket
# (the engine spawns seats through it) → the seat store and its caps → the
# engine itself → is it answering. Nothing here installs an app: what a
# person may run is a catalogue, projected through the engine's API.
---
- name: A Debian-family host with systemd
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.service_mgr == 'systemd'
    fail_msg: "the wolf role expects a Debian-family host with systemd"
    quiet: true

- name: Hostname
  ansible.builtin.hostname:
    name: "{{ arcade_wolf_hostname }}"

# --- the card ---------------------------------------------------------------
# The cloud images carry a kernel and no firmware blobs, so a card that needs
# them is dead until this lands. It is survivable only because this guest has
# an emulated display: it boots, converges, and THEN has a card.
- name: The deb822 sources file (trixie's default; older layouts keep their own)
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/debian.sources
  register: arcade_wolf_sources

- name: non-free-firmware among the apt components (the card's blobs live there)
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/debian.sources
    regexp: '^(Components:(?!.*non-free-firmware).*)$'
    replace: '\1 non-free-firmware'
  register: arcade_wolf_components
  when: arcade_wolf_sources.stat.exists

- name: Packages (the engine is a container; this is what carries it)
  ansible.builtin.apt:
    name: "{{ arcade_wolf_packages + arcade_wolf_firmware_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if arcade_wolf_components is changed else 3600 }}"
  register: arcade_wolf_pkgs

- name: "uinput at every boot (the engine makes its virtual pads through it)"
  ansible.builtin.copy:
    dest: /etc/modules-load.d/arcade-wolf.conf
    content: |
      # Managed by ansible (tomblancdev.wolf) — the seat engine's input plane
      uinput
    mode: "0644"
  register: arcade_wolf_modconf

- name: …and now, without waiting for one
  community.general.modprobe:
    name: uinput
    state: present

- name: The guest agent (the hypervisor asks this guest what its address is)
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: The render node exists
  ansible.builtin.stat:
    path: "{{ arcade_wolf_render_node }}"
  register: arcade_wolf_render

# The driver binds at boot. On the FIRST converge the firmware arrives after
# that boot, so the card is present and unusable — an honest state, and one
# worth clearing without making somebody drive to the machine. Reloading the
# module is enough on a host where nothing has the card open, which is exactly
# what this host is until the engine starts.
- name: Rebind the driver now that its firmware exists
  ansible.builtin.shell:
    cmd: modprobe -r amdgpu 2>/dev/null; modprobe amdgpu; sleep 3
    executable: /bin/sh
  changed_when: true
  when:
    - not arcade_wolf_render.stat.exists
    - arcade_wolf_pkgs is changed
    - not ansible_check_mode

- name: Look again
  ansible.builtin.stat:
    path: "{{ arcade_wolf_render_node }}"
  register: arcade_wolf_render2
  when: not arcade_wolf_render.stat.exists and not ansible_check_mode

- name: "A reboot is the honest fallback (the screen role does the same for its layer)"
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - not arcade_wolf_render.stat.exists
    - arcade_wolf_render2.stat.exists is defined
    - not arcade_wolf_render2.stat.exists
    - arcade_wolf_pkgs is changed
    - not ansible_check_mode

- name: The render node, for the last time
  ansible.builtin.stat:
    path: "{{ arcade_wolf_render_node }}"
  register: arcade_wolf_render_final
  when: not ansible_check_mode

- name: "Say so plainly when the card is still not there"
  ansible.builtin.assert:
    that:
      - arcade_wolf_render_final.stat.exists
    fail_msg: >-
      {{ arcade_wolf_render_node }} is absent: this guest has no usable card.
      The firmware is installed and the driver was reloaded and the guest was
      rebooted, so the fault is upstream of the guest — check that the card is
      actually mapped through to it, and that the node is not holding it for
      another guest (a PCI mapping may be DEFINED on several, used by one).
    quiet: true
  when: not ansible_check_mode

# --- the container engine ---------------------------------------------------
# Rootful, with its socket: the seat engine creates and destroys the seat
# containers itself, which means it holds the engine's own API. That is a
# large privilege and it is stated where the permission model lives, not here.
- name: The podman socket (the seat engine speaks to it as if it were docker)
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started
    daemon_reload: true

# --- the seat store ---------------------------------------------------------
# Everything this device already is, in one read. THREE questions, not one,
# and the reason is a near-miss worth keeping: `blkid -s TYPE` on a
# PARTITIONED disk returns NOTHING — a partition table is not a filesystem —
# so a guard that asks only about TYPE reads an OS disk as blank and hands it
# to mkfs. Ask about the partition table too, and ask whether root is standing
# on it, because kernel device letters are assigned in probe order and a
# `sdb` in somebody's config is a guess about enumeration, not a fact.
- name: Everything the seat device already is
  ansible.builtin.shell:
    cmd: |
      set -u
      dev=$(readlink -f {{ arcade_wolf_data_device | quote }} 2>/dev/null || echo "")
      if [ ! -b "$dev" ]; then
        printf '{"present": false}\n'
        exit 0
      fi
      type=$(blkid -o value -s TYPE "$dev" 2>/dev/null || true)
      pttype=$(blkid -o value -s PTTYPE "$dev" 2>/dev/null || true)
      holders=$(lsblk -nro NAME "$dev" 2>/dev/null | tail -n +2 | tr '\n' ' ' | sed 's/ *$//')
      root=$(findmnt -no SOURCE / 2>/dev/null || true)
      rootdisk=$(lsblk -nro PKNAME "$root" 2>/dev/null | head -1)
      [ -n "$rootdisk" ] && rootdisk="/dev/$rootdisk" || rootdisk="$root"
      printf '{"present": true, "dev": "%s", "type": "%s", "pttype": "%s", "holders": "%s", "rootdisk": "%s"}\n' \
        "$dev" "$type" "$pttype" "$holders" "$rootdisk"
    executable: /bin/sh
  register: arcade_wolf_dev
  changed_when: false
  check_mode: false
  when: arcade_wolf_data_device != ''

- name: What that means
  ansible.builtin.set_fact:
    arcade_wolf_disk: "{{ arcade_wolf_dev.stdout | from_json }}"
  when: arcade_wolf_data_device != ''

- name: The seat device exists
  ansible.builtin.assert:
    that:
      - arcade_wolf_disk.present
    fail_msg: >-
      {{ arcade_wolf_data_device }} is not a block device on this host. Name
      it by a stable path — /dev/disk/by-id/… or /dev/disk/by-path/… — never
      /dev/sdX: the letters are handed out in probe order, and this role would
      otherwise be one enumeration away from the wrong disk.
    quiet: true
  when: arcade_wolf_data_device != ''

- name: Refuse anything that is not blank or already ours
  ansible.builtin.assert:
    that:
      - arcade_wolf_disk.type in ['', 'xfs']
      - arcade_wolf_disk.pttype == ''
      - arcade_wolf_disk.holders == ''
      - arcade_wolf_disk.dev != arcade_wolf_disk.rootdisk
    fail_msg: >-
      REFUSING to make a filesystem on {{ arcade_wolf_disk.dev }}:
      filesystem='{{ arcade_wolf_disk.type }}'
      partition-table='{{ arcade_wolf_disk.pttype }}'
      partitions='{{ arcade_wolf_disk.holders }}'
      root-is-on='{{ arcade_wolf_disk.rootdisk }}'.
      A partition table is not a filesystem, so a device that looks empty to
      `blkid -s TYPE` can still be somebody's whole operating system — which
      is exactly the disk this check was written for.
    quiet: true
  when: arcade_wolf_data_device != ''

- name: "The seat store's filesystem (project quotas: a cap has to be enforced somewhere real)"
  community.general.filesystem:
    fstype: xfs
    dev: "{{ arcade_wolf_data_device }}"
  when: arcade_wolf_data_device != '' and arcade_wolf_disk.type == ''

- name: Mounted
  ansible.posix.mount:
    src: "{{ arcade_wolf_data_device }}"
    path: "{{ arcade_wolf_seats }}"
    fstype: xfs
    opts: "{{ arcade_wolf_data_fs_opts }}"
    state: mounted
  when: arcade_wolf_data_device != ''

- name: The group the seats' files belong to
  ansible.builtin.group:
    name: "{{ arcade_wolf_run_group }}"
    gid: "{{ arcade_wolf_run_gid }}"

- name: The three directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ arcade_wolf_state }}" }
    - { path: "{{ arcade_wolf_state }}/cfg" }
    - { path: "{{ arcade_wolf_runtime }}", mode: "0755" }
    - { path: "{{ arcade_wolf_seats }}", group: "{{ arcade_wolf_run_group }}", mode: "0775" }
  loop_control: { label: "{{ item.path }}" }

# One-time cleanup: the first build bound the seat store at <root>/profile_data
# and left the bind in fstab. It is torn down here so a reboot does not raise
# it again; harmless where it never existed.
- name: The old profile_data bind is gone (fstab + mount)
  ansible.posix.mount:
    path: "{{ arcade_wolf_state }}/profile_data"
    state: absent

# The engine keeps everything it owns under ONE root (HOST_APPS_STATE_FOLDER)
# and lays each person's seat home out FLAT beneath it — <root>/<profile>/<app>
# — NOT under a `profile_data/` subdir. Wolf's older docs implied one and the
# first build bound the seat store there; found live at G5b rung 3 when a real
# profile's data landed on the OS disk and the quota never applied. The fix
# keeps the two-disk split (cfg + keypair small and safe on the OS disk; the
# people capped on the store) by making EACH profile dir under the engine root
# a SYMLINK to its quota'd home on the store. Proven live: Wolf follows the
# link when it creates the home, and podman follows it when it bind-mounts the
# home into the seat.  (The old profile_data bind is torn down by hand once.)

# /run is a tmpfs: without this the socket directory is gone at the next boot
# and every seat fails in a way that looks like the engine's fault.
- name: The runtime directory survives a reboot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/arcade-wolf.conf
    content: |
      # Managed by ansible (tomblancdev.wolf) — /run is a tmpfs; the seat
      # engine's socket directory must exist before it starts, at THIS path,
      # because the paths it hands to seat containers are host paths.
      d {{ arcade_wolf_runtime }} 0755 root root -
    mode: "0644"

# nfs-common drags rpcbind in, and rpcbind opens 111 on every interface. NFSv4
# has no use for it — the protocol carries its own port discovery — so this is
# a listening service that exists only because a dependency wanted it. Masked,
# not merely stopped: a package update would start it again.
- name: rpcbind masked (NFSv4 does not use it, and it listens on every interface)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: [rpcbind.socket, rpcbind.service]
  failed_when: false
  when: arcade_wolf_mounts | length > 0

# --- what every seat can see ------------------------------------------------
- name: Mount points (once mounted, ownership is the server's)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
  loop: "{{ arcade_wolf_mounts }}"
  loop_control: { label: "{{ item.path }}" }

- name: The shared mounts (fstab + mounted now)
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: nfs4
    opts: "{{ arcade_wolf_mount_options[item.mode] }}"
    state: mounted
  loop: "{{ arcade_wolf_mounts }}"
  loop_control: { label: "{{ item.path }} ({{ item.mode }}: {{ item.src }})" }

# --- the caps ---------------------------------------------------------------
- name: Each profile's directory
  ansible.builtin.file:
    path: "{{ arcade_wolf_seats }}/{{ item.id }}"
    state: directory
    owner: "{{ item.uid | default(arcade_wolf_run_uid) }}"
    group: "{{ arcade_wolf_run_group }}"
    mode: "0750"
  loop: "{{ arcade_wolf_profiles }}"
  loop_control: { label: "{{ item.label }} ({{ item.id }})" }

# A profile dir the engine already wrote as a REAL directory under its root
# (an older layout, or a seat that ran before this play) is moved onto the
# store, once, before it becomes a symlink. Safe only while the seat is
# stopped (its home is bind-mounted while it runs); the play stops it first.
- name: A real profile dir under the engine root is migrated onto the store
  ansible.builtin.shell:
    cmd: |
      set -eu
      link={{ (arcade_wolf_state ~ '/' ~ item.id) | quote }}
      store={{ (arcade_wolf_seats ~ '/' ~ item.id) | quote }}
      [ -L "$link" ] && exit 0
      if [ -d "$link" ]; then
        cp -a "$link/." "$store/" 2>/dev/null || true
        rm -rf "$link"
        echo MIGRATED
      fi
    executable: /bin/sh
  register: arcade_wolf_migrate
  changed_when: "'MIGRATED' in arcade_wolf_migrate.stdout"
  loop: "{{ arcade_wolf_profiles }}"
  loop_control: { label: "{{ item.label }} ({{ item.id }})" }
  when: arcade_wolf_data_device != ''

- name: The engine-root profile dir is a symlink to the capped store
  ansible.builtin.file:
    src: "{{ arcade_wolf_seats }}/{{ item.id }}"
    dest: "{{ arcade_wolf_state }}/{{ item.id }}"
    state: link
    force: true
    follow: false
  loop: "{{ arcade_wolf_profiles }}"
  loop_control: { label: "{{ item.label }} ({{ item.id }})" }
  when: arcade_wolf_data_device != ''

# The golden template: a completed app home, captured once, copied into a
# person's seat the first time it is empty — so a new person's console opens
# ready, never on a first-run wizard (games.md, G5b rung 3). No template =
# a no-op, so this is safe before one is captured. Keyed by the app's own
# directory name (its `title`), which is what Wolf uses for the seat home.
- name: Seed a new profile's app home from the golden template (once, when empty)
  ansible.builtin.shell:
    cmd: |
      set -eu
      dest={{ (arcade_wolf_seats ~ '/' ~ item.0.id ~ '/' ~ item.1) | quote }}
      tmpl={{ (arcade_wolf_golden_dir ~ '/' ~ item.1) | quote }}
      [ -d "$tmpl" ] || { echo NO_TEMPLATE; exit 0; }
      if [ -d "$dest" ] && [ -n "$(ls -A "$dest" 2>/dev/null)" ]; then echo EXISTS; exit 0; fi
      mkdir -p "$dest"
      cp -a "$tmpl/." "$dest/"
      chown -R {{ item.0.uid | default(arcade_wolf_run_uid) }}:{{ arcade_wolf_run_gid }} "$dest"
      echo SEEDED
    executable: /bin/sh
  register: arcade_wolf_seed
  changed_when: "'SEEDED' in arcade_wolf_seed.stdout"
  loop: "{{ arcade_wolf_profiles | product(arcade_wolf_golden_apps) | list }}"
  loop_control: { label: "{{ item.0.label }} <- {{ item.1 }}" }
  when: arcade_wolf_data_device != '' and arcade_wolf_golden_apps | length > 0

- name: The project register (a quota is keyed on a directory, by id)
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - dest: /etc/projid
      content: |
        # Managed by ansible (tomblancdev.wolf) — label -> project id
        {% for p in arcade_wolf_profiles %}
        {{ p.label }}:{{ loop.index + 1000 }}
        {% endfor %}
    - dest: /etc/projects
      content: |
        # Managed by ansible (tomblancdev.wolf) — project id -> directory
        {% for p in arcade_wolf_profiles %}
        {{ loop.index + 1000 }}:{{ arcade_wolf_seats }}/{{ p.id }}
        {% endfor %}
  loop_control: { label: "{{ item.dest }}" }
  when: arcade_wolf_data_device != ''

- name: The caps themselves, on the filesystem
  ansible.builtin.shell:
    cmd: |
      set -eu
      read_hard() {
        xfs_quota -x -c 'report -p -N -b' {{ arcade_wolf_seats }} 2>/dev/null \
          | awk -v p='{{ item.label }}' '$1 == p { print $4 }'
      }
      before=$(read_hard)
      # -s rescans the tree and warns on symlinks/special files (the shared roms
      # link, a save special file) - harmless, and noise, so drop its stderr
      xfs_quota -x -c 'project -s {{ item.label }}' {{ arcade_wolf_seats }} >/dev/null 2>&1
      xfs_quota -x -c 'limit -p bhard={{ item.quota | default(arcade_wolf_default_quota) }} {{ item.label }}' {{ arcade_wolf_seats }}
      after=$(read_hard)
      # distinct tokens: "UNCHANGED" CONTAINS "CHANGED", so a substring test on
      # it reports changed forever (the rung-2 bug this replaces)
      [ "$before" = "$after" ] && echo QUOTA_STEADY || echo "QUOTA_SET $before -> $after"
    executable: /bin/sh
  loop: "{{ arcade_wolf_profiles }}"
  loop_control: { label: "{{ item.label }}: {{ item.quota | default(arcade_wolf_default_quota) }}" }
  register: arcade_wolf_quota
  changed_when: arcade_wolf_quota.stdout is defined and 'QUOTA_SET' in arcade_wolf_quota.stdout
  when: arcade_wolf_data_device != ''

# --- the engine -------------------------------------------------------------
- name: "The Quadlet (podman runs it as a system unit: wolf.service)"
  ansible.builtin.template:
    src: wolf.container.j2
    dest: /etc/containers/systemd/wolf.container
    mode: "0644"
  notify: arcade wolf restart

- name: The virtual pads hidden from anything else that enumerates input
  ansible.builtin.copy:
    src: 90-arcade-wolf-virtual-input.rules
    dest: /etc/udev/rules.d/90-arcade-wolf-virtual-input.rules
    mode: "0644"
  notify: arcade wolf udev
  when: arcade_wolf_hide_virtual_pads | bool

- name: …and gone when it is not wanted
  ansible.builtin.file:
    path: /etc/udev/rules.d/90-arcade-wolf-virtual-input.rules
    state: absent
  notify: arcade wolf udev
  when: not (arcade_wolf_hide_virtual_pads | bool)

- name: "Running (a generated unit: no enable — the [Install] section is the enable)"
  ansible.builtin.systemd:
    name: wolf
    state: started
    daemon_reload: true

- name: Flush (the engine is up before anything asks it a question)
  ansible.builtin.meta: flush_handlers

# --- the catalogue ------------------------------------------------------------
# What may exist, as data on disk; a oneshot unit projects it through the
# engine's API at every engine start. At converge the same unit is run again,
# and its report (ADDED / REPLACED / REMOVED / UNCHANGED per app) is what
# decides `changed`, because the play's exit code would not.
- name: The projection itself
  ansible.builtin.copy:
    src: wolf-catalogue
    dest: /usr/local/sbin/wolf-catalogue
    mode: "0755"

- name: The catalogue's directory
  ansible.builtin.file:
    path: "{{ arcade_wolf_catalogue_file | dirname }}"
    state: directory
    mode: "0755"

- name: "The catalogue — what may exist (data; nothing here is a secret)"
  ansible.builtin.copy:
    dest: "{{ arcade_wolf_catalogue_file }}"
    content: "{{ {'apps': arcade_wolf_apps, 'absent': arcade_wolf_apps_absent} | to_nice_json }}\n"
    mode: "0644"

- name: "The unit that projects it whenever the engine starts"
  ansible.builtin.template:
    src: wolf-catalogue.service.j2
    dest: /etc/systemd/system/wolf-catalogue.service
    mode: "0644"
  register: arcade_wolf_catalogue_unit

- name: …wanted by the engine's own unit
  ansible.builtin.systemd:
    name: wolf-catalogue
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode   # a unit check mode never wrote cannot be enabled

- name: Health — the engine answers on its own door (the first start pulls the image)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ arcade_wolf_ports.http }}/serverinfo"
    status_code: [200, 401, 404]
  register: arcade_wolf_up
  retries: 40
  delay: 5
  until: arcade_wolf_up.status is defined and arcade_wolf_up.status in [200, 401, 404]
  changed_when: false
  when: not ansible_check_mode

- name: "Project the catalogue now (a report, one line per app)"
  ansible.builtin.command:
    cmd: /usr/local/sbin/wolf-catalogue {{ arcade_wolf_catalogue_file }}
  environment:
    WOLF_SOCKET_PATH: "{{ arcade_wolf_runtime }}/wolf.sock"
  register: arcade_wolf_projection
  changed_when: arcade_wolf_projection.stdout is search('^(ADDED|REPLACED|REMOVED) ', multiline=True)
  when: not ansible_check_mode and (arcade_wolf_apps | length > 0 or arcade_wolf_apps_absent | length > 0)

- name: "…and the unit agrees with it (so the next engine start does the same)"
  ansible.builtin.systemd:
    name: wolf-catalogue
    state: started
  when: not ansible_check_mode
