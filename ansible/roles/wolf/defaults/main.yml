# wolf — the seat engine. One container per person, spawned when somebody
# connects and removed when they leave; the host carries the engine and
# nothing else. Everything here is a lab's to set; none of it is a secret.

arcade_wolf_hostname: wolf

# The engine, pinned by DIGEST. `:stable` is a moving tag — the whole point of
# a pin is that a converge cannot quietly change the engine under a session.
# Bumping this line IS the update.
arcade_wolf_image: "ghcr.io/games-on-whales/wolf:stable"

# --- the three paths, and why they are three -------------------------------
# state: THE root the engine owns — its config, its keypair, its pairings, and
#        `profile_data/`. Small and irreplaceable apart from profile_data,
#        which is a bind mount of the seat store below. It has to be one root:
#        the image recomputes every cfg path from it and ignores what you set
#        (see the unit template), so a directory is the only lever there is.
arcade_wolf_state: /srv/wolf
# runtime: the Wayland and audio sockets. Upstream is explicit that this path
#        "is expected to be present in the host and mounted in the container",
#        because the paths it hands to the app containers are HOST paths. Get
#        this wrong and every seat dies seconds after it starts, with no
#        display and no sound and nothing in the log that says why.
arcade_wolf_runtime: /run/wolf
# seats: what the people who use this thing put in it — one directory per
#        profile, bind-mounted onto <state>/profile_data so the engine finds
#        it where it insists on looking. Its own filesystem, so a cap can be a
#        filesystem fact instead of an honour system, and so re-making the
#        people's disk never costs the engine its pairings.
arcade_wolf_seats: /srv/seats

# The block device to make the seat store out of. "" = don't: the engine then
# keeps profile data on whatever filesystem arcade_wolf_seats already sits on,
# and no quota is enforced.
#
# NAME IT BY A STABLE PATH — /dev/disk/by-id/… or /dev/disk/by-path/… —
# NEVER /dev/sdX. Kernel letters are handed out in probe order, not in the
# order the disks were attached: on the host this role was written for, the
# SECOND disk came up as `sda` and the OS as `sdb`. A device that already
# carries a filesystem, a partition table, partitions, or the running root is
# refused, never overwritten.
arcade_wolf_data_device: ""
#  e.g. /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
arcade_wolf_data_fs_opts: "rw,noatime,prjquota"

# --- who may use how much --------------------------------------------------
# A profile is a DRAWER with a name. `id` is the folder the engine's paired
# clients are pointed at (its `app_state_folder` — ours to choose; the hash
# the engine mints at pairing is what a client wears until somebody points
# it at a drawer). `label` is what a human and the quota report read. `uid`
# is the account every seat opened from that drawer runs as — its own, and
# STABLE: the files are owned by it, so a person is never renumbered. `quota`
# is their cap. `shared: true` marks a drawer with no person behind it (a
# living-room device everybody uses); it means nothing to this role — a
# panel decides who may point a device at it. Empty = no drawers; the
# machinery exists so that adding a person is a line of data.
arcade_wolf_profiles: []
#  - { id: someone, label: someone, uid: 3001, quota: 150g }
#  - { id: salon,   label: salon,   uid: 3100, shared: true }
arcade_wolf_default_quota: "100g"

# The uid a seat runs as when its profile line names none — and the uid the
# ENGINE gives a client nobody has pointed at a drawer yet. Deliberately NOT
# 1000: on a desktop-derived host 1000 is a real interactive account, and
# seats inheriting it was a fault found the hard way.
arcade_wolf_run_uid: 3000
arcade_wolf_run_gid: 3000
arcade_wolf_run_group: seats

# --- the API bridge --------------------------------------------------------
# The engine's API lives on a unix socket (<runtime>/wolf.sock) and carries
# NO authentication of its own: whoever reaches it can pair a client, point
# it at any drawer, stop any session. A panel on another host needs exactly
# that, so this lends the socket out on ONE address:port through systemd's
# socket proxy — socket-activated (nothing runs until a first connection,
# the proxy leaves when idle) — and the firewall row that lets exactly one
# host reach this port IS the authentication. "" = no bridge.
arcade_wolf_api_listen: ""
#  e.g. "203.0.113.23:47900"   — the guest's own address, never 0.0.0.0
arcade_wolf_api_idle: 60       # seconds the proxy lingers after its last connection

# --- the doors -------------------------------------------------------------
# Upstream's defaults. They are also Sunshine's defaults, on purpose — same
# protocol — so a host that runs both must move one of them. Read from the
# engine's own source: each of these has its own WOLF_*_PORT variable.
arcade_wolf_ports:
  https: 47984
  http: 47989
  rtsp: 48010
  video: 48100
  audio: 48200
  control: 47999

# the render node the engine hands to seats. Named explicitly: a box with two
# cards must not be left to pick.
arcade_wolf_render_node: /dev/dri/renderD128
arcade_wolf_log_level: INFO

# extra env, last word — anything upstream adds that this role has not learned
arcade_wolf_extra_env: {}

# The firmware the card needs to exist at all. The cloud images ship none —
# neither flavour — so it is installed here; that works only because this
# guest kept an emulated display and can therefore boot without its card.
arcade_wolf_firmware_packages: [firmware-amd-graphics]
arcade_wolf_packages: [podman, xfsprogs, qemu-guest-agent, uidmap, nfs-common, curl, jq, rsync, python3-tomlkit]   # tomlkit: wolf-catalogue rewrites one block of the engine's own TOML, the rest byte for byte

# --- what every seat can see -----------------------------------------------
# Shared content: a ROM store, an emulation kit — one copy, mounted read-only,
# rather than every seat pulling its own into its own home (and its own quota).
# Soft mounts on purpose: a server that goes away returns an error to the app
# instead of hanging the box.
arcade_wolf_mounts: []
#  - { src: "198.51.100.12:/tank/games/roms", path: /srv/roms, mode: ro }
arcade_wolf_mount_options:
  live: "rw,vers=4.2,soft,timeo=30,retrans=3,_netdev,nofail"
  ro: "ro,vers=4.2,soft,timeo=30,retrans=3,_netdev,nofail"

# The engine's virtual pads report the vendor/product ids of the real
# controllers they imitate — its Xbox pad is byte-identical to a Microsoft
# one, its DualSense to a Sony one — so only the NAME tells them apart, and
# every one of them starts with "Wolf". Hiding them matters on a host where
# something ELSE enumerates input and would grab them (a desktop session, a
# game launcher). On an appliance nothing does, and a rule that touches the
# input path is not worth the risk to the thing it would protect. Off by
# default, here for the host that needs it.
arcade_wolf_hide_virtual_pads: false

# --- the catalogue: what may exist, landed in the engine's config ----------
# The engine computes a tile's video caps ONLY when it reads its config file
# at start; an app added through its API is saved to that file at once but
# lives in memory with an empty caps until the next start — and such a tile
# shows in Moonlight and never sends a frame. So what MAY exist is written
# here as data, and `wolf-catalogue project` rewrites the Moonlight profile's
# app list in the engine's own config.toml as the engine's unit starts
# (ExecStartPre): add what is missing, replace what differs, remove what is
# named absent — and leave everything else alone, because an app a person
# added is runtime state and not this role's to purge. Nothing else in the
# file is touched, and a rewrite that reads back wrong never replaces it.
# A converge pushes nothing: `wolf-catalogue diff` reads what the engine has,
# and a difference restarts the engine only when nobody is playing; otherwise
# it is deferred (the play says so, the journal too) to the next start.
#
# apps: the engine's own app shape (title, icon_png_path, runner{type, name,
# image, mounts, env, devices, ports, base_create_json}) — WITHOUT the
# pipeline fields and WITHOUT an id: both are the engine's, computed at load.
# The seat's ceiling (a class) is expressed in base_create_json as the
# container engine's own HostConfig (NanoCpus, Memory), rendered by whoever
# hands this in — a helper for that is arcade_wolf_host_config below.
arcade_wolf_apps: []
#  - title: RetroDECK
#    icon_png_path: "https://example.com/retrodeck.png"
#    runner:
#      type: docker
#      name: borne
#      image: "ghcr.io/tomblancdev/borne:0.1.0"
#      mounts: ["/srv/roms:/srv/roms:ro"]
#      env: ["RUN_SWAY=true", "GOW_REQUIRED_DEVICES=/dev/input/* /dev/dri/* /dev/nvidia*"]
#      devices: []
#      ports: []
#      base_create_json: '{"HostConfig": {...}}'
# titles the engine ships or somebody added that must NOT be offered — the
# engine's own launcher UI, its test pattern
arcade_wolf_apps_absent: []
#  - Wolf UI
#  - Test ball
arcade_wolf_catalogue_file: /etc/wolf/catalogue.json

# The two HostConfig sets a seat can carry, after the engine's own shipped
# apps. `standard` is what a plain app gets; `nested_sandbox` is the
# Steam-grade set — an app that runs its OWN sandbox inside the seat
# (Steam's pressure-vessel, a Flatpak's bubblewrap) needs SYS_ADMIN and no
# seccomp/AppArmor profile in the way, or it never starts. Both keep
# Privileged false and the input cgroup rules the engine's virtual pads need.
#
# NOT `IpcMode: host`, which the engine's examples carry. A seat is a
# person, and host IPC makes every seat share ONE System V namespace and ONE
# /dev/shm: Steam keys its semaphores by fixed numbers and guards them 0600,
# so the first uid to run it locks every other uid out ("Assertion Failed:
# Permission denied", then a deadlock on a grey screen — found with the
# second person, 2026-08-28); a killed seat never removes them; and its
# Chromium left 2 GB of 777 shm files on a RAM tmpfs that any other seat
# could read. A private namespace per seat ends all three. Audio does not
# need the shared one: the seat talks to the engine's PulseAudio over its
# unix socket with memfd (both sides ≥ PA 10). What a private /dev/shm
# needs is a SIZE — the engine's default 64 MiB starves a browser-based
# launcher — so each set says one; it is a ceiling, RAM is used as touched.
arcade_wolf_host_config:
  standard:
    ShmSize: 1073741824       # 1 GiB
    Privileged: false
    CapAdd: [NET_RAW, MKNOD, NET_ADMIN, SYS_ADMIN, SYS_NICE]
    DeviceCgroupRules: ["c 13:* rmw", "c 244:* rmw"]
  nested_sandbox:
    ShmSize: 2147483648       # 2 GiB: Steam's CEF alone left 2 GB in a day
    Privileged: false
    CapAdd: [SYS_ADMIN, SYS_NICE, SYS_PTRACE, NET_RAW, MKNOD, NET_ADMIN]
    # THE nested-sandbox unlock, and it must be `unmask=all`, NOT empty
    # MaskedPaths/ReadonlyPaths. The container engine masks paths under /proc
    # (kcore, sys, acpi, ...) with locked read-only mounts, and a nested
    # sandbox (a Flatpak's bubblewrap, Steam's pressure-vessel) cannot mount
    # its OWN fresh /proc over those - `bwrap: Can't mount proc on /proc:
    # Operation not permitted`, and the app never starts. The Docker-API
    # `MaskedPaths: []` does NOT work on podman: an empty array reads as
    # "unspecified", and podman re-applies its defaults (proven live - the
    # masks were still mounted with MaskedPaths=0). podman's own `unmask`
    # security-opt is the lever that takes, over both the CLI and the
    # docker-compat socket Wolf drives (both proven, 2026-08-27).
    SecurityOpt: ["seccomp=unconfined", "apparmor=unconfined", "unmask=all"]
    Ulimits: [{ Name: nofile, Hard: 10240, Soft: 10240 }]
    DeviceCgroupRules: ["c 13:* rmw", "c 244:* rmw"]

# --- a person's state: the irreplaceable half, copied off this box ----------
# A seat home is LOCAL - play never touches the network, whatever the app
# writes and however often. The folders an app declares as STATE (saves,
# worlds, gamelists: small next to installs, and the only part nobody can
# re-download) are copied by `wolf-state-sync` to a mount of the person's
# own, <root>/<profile id>, every <interval>, at every engine start and stop,
# and at every converge. The home is the truth while this host runs; the
# mount is the copy of record between sessions - and being one directory per
# person, whatever snapshots and backs it up does so per person.
#
# Two copies are made safe by ONE rule: a folder is never pushed before it
# has been pulled once (a marker in the profile dir, outside the app home,
# records it - a seeded template cannot carry one). So a re-made disk restores
# itself at the first run and can never wipe what the mount holds. The script
# refuses a <root>/<id> that is not a mountpoint, skips a person whose state
# has not changed since the last push (a local mtime check: the idle cost does
# not grow with the people), and logs `OK` per run - the heartbeat a dead-man
# watches for. What it costs: at most <interval> of play against THIS box's
# disk dying, and a file mid-write may be copied torn until the next run.
# Not for two hosts: one host holds a person's live state at a time.
arcade_wolf_state_root: ""     # "" = nothing is copied anywhere. Each <root>/<id> must be a mountpoint
#  e.g. /srv/seats-state   (with a mount per profile in arcade_wolf_mounts: <src>/<id> -> <root>/<id>)
arcade_wolf_state_apps: {}     # app title -> the folders that ARE state, relative to that app's home
#  RetroDECK: [retrodeck/saves, retrodeck/states, retrodeck/screenshots, retrodeck/ES-DE/gamelists]
arcade_wolf_state_interval: 5min
arcade_wolf_state_file: /etc/wolf/state.json

# --- the golden template: a new person opens a ready console, not a wizard ---
# Some apps (RetroDECK) have no headless first run, so the only way to spare a
# new person the setup is to copy a COMPLETED home into their seat the first
# time it is empty. Capture one clean setup (no saves) into
# <arcade_wolf_golden_dir>/<app title>, and list that title here; the role
# seeds it per profile. Empty = every new seat runs the app's own first run.
arcade_wolf_golden_dir: "{{ arcade_wolf_state }}/golden"
arcade_wolf_golden_apps: []
#  - RetroDECK

# A PART of a home, seeded when that part is absent. For an app whose home
# cannot be a template because the first run is the person's own (Steam: the
# login) but which has parts that can — a title's Proton prefix. Steam runs
# a title's install script at the first launch after an install and records
# each step as done INSIDE THE PREFIX'S OWN REGISTRY
# (HKLM\Software\Valve\Steam\Apps\<appid>: <step>=1 — the Steamworks
# HasRunKey rule), so a step that hangs under Wine hangs once per PREFIX,
# i.e. once per drawer (Arkham City's 2007 AMD Dual-Core Optimizer: 13
# minutes, in every fresh drawer, 2026-08-28). Proton keeps a prefix it
# finds — it copies its defaults only where pfx/user.reg is missing and
# deletes only on a downgrade (its own script) — so a prefix captured once,
# with the marks and without the person (`wolf-golden-prefix`), seeded
# before the title's first launch, is a first launch that just starts. Each
# entry: the app title and the path INSIDE its home, both as the seat sees
# them; the template lives at <arcade_wolf_golden_dir>/<app>/<path>. Every
# directory on the way that is missing is made for the seat's uid — so the
# path must be the app's REAL one (read it in a seat home: Steam's is
# `.steam/steam/…`, a real directory the image lays out). Seeded
# once, when absent; a person's own prefix is never touched.
arcade_wolf_golden_parts: []
#  - { app: Steam, path: .steam/steam/steamapps/compatdata/200260 }

# --- the companions: a container beside a seat, for what its image does not
# carry (v0.14.0) -------------------------------------------------------------
# The engine routes a seat's sound to the session's sink by the HOSTNAME a
# stream reports, and hands every seat its audio socket (PULSE_SERVER) and
# its sink's name (PULSE_SINK). A second container wearing the seat's
# hostname, socket and sink is therefore mixed into the seat — whatever
# image the seat runs, and without that image knowing. `wolf-sidecars`
# starts one such companion per entry beside every seat and removes it with
# the seat (the engine's own event feed, the one its router reads);
# `wolf-seat-link <drawer> <name>` is the once-per-person step that puts the
# file a companion requires into the drawer. A companion runs as the
# drawer's uid with every capability dropped, no device, a memory ceiling,
# only the audio socket lent (never the runtime dir: the engine's API socket
# lives there and authenticates nobody). Its data folder is the DRAWER's —
# <seats>/<drawer>/<home>, outside every app home: a golden template can
# never carry it, one link serves every tile — and is state (copied off the
# box with the person's) unless `state: false`. The first companion: Le
# Juke, a Spotify Connect receiver — the person's music under whatever they
# play, driven from their phone (github.com/tomblancdev/juke).
arcade_wolf_sidecars: []
#  - name: spotify                            # the companion: <name>_<session id>
#    image: ghcr.io/tomblancdev/juke:0.1.0    # pulled by the converge, never at a seat's start; a bump IS the update
#    home: .juke/spotify                      # <dir>/<folder> under the drawer — two levels: the state copy needs both
#    data_root: /var/lib/juke                 # where that folder is mounted inside the companion
#    requires: credentials.json               # no file in the folder, no companion (one line instead)
#    env: { JUKE_NAME: "Le Juke – {app}" }    # {app} / {drawer} are the seat's
#    memory: 256m
#    state: true
arcade_wolf_sidecars_file: /etc/wolf/sidecars.json
