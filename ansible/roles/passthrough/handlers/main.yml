---
# the initramfs carries the modprobe options (vfio-pci ids) and the blacklist;
# proxmox-boot-tool renders GRUB + copies kernels/initrds onto every ESP
- name: arcade passthrough initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true

- name: arcade passthrough boot
  ansible.builtin.command: proxmox-boot-tool refresh
  changed_when: true

- name: arcade passthrough udev
  ansible.builtin.command: udevadm control --reload
  changed_when: true
