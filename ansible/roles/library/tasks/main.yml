# library — the ROM store's local copy. One unit: arcade-roms-sync (oneshot,
# at every boot; the mount's absence skips it).
---
- name: rsync in the image
  ansible.builtin.command: rpm -q rsync
  changed_when: false
  check_mode: false

- name: The cache, owned by the player's user
  ansible.builtin.file:
    path: "{{ arcade_library_cache }}"
    state: directory
    owner: "{{ arcade_library_user }}"
    group: "{{ arcade_library_user }}"
    mode: "0755"

# the unit must run AFTER the source is mounted: the condition is evaluated
# at activation, and an NFS mount lands seconds after remote-fs.target on a
# fresh boot (seen at G1: skipped at 13.1 s, mounted at 13.5 s). The mount
# unit's name follows the canonical path (/srv -> /var/srv on Fedora Atomic).
- name: The source's mount unit
  ansible.builtin.command: sh -c 'systemd-escape -p --suffix=mount "$(readlink -f {{ arcade_library_source | quote }})"'
  register: arcade_library_mount_unit
  changed_when: false
  check_mode: false

- name: arcade-roms-sync — server -> NVMe at every wake
  ansible.builtin.template:
    src: arcade-roms-sync.service.j2
    dest: /etc/systemd/system/arcade-roms-sync.service
    mode: "0644"
  notify: arcade library reload

- name: Flush (the unit file is read before it is started)
  ansible.builtin.meta: flush_handlers

- name: Enabled (every boot) and run once now
  ansible.builtin.systemd:
    name: arcade-roms-sync
    enabled: "{{ arcade_library_sync_at_wake }}"
    state: "{{ 'started' if arcade_library_sync_at_wake else 'stopped' }}"
    daemon_reload: true
