name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/arcade ./cmd/arcade
  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet ansible-core
      - run: ansible-galaxy collection build ansible/ --output-path /tmp/collection
      - run: ansible-galaxy collection install /tmp/collection/tomblancdev-arcade-*.tar.gz -p /tmp/collections
      - run: ANSIBLE_COLLECTIONS_PATH=/tmp/collections ansible-galaxy collection list tomblancdev.arcade
  tofu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [screen-vm, doorman-ct, servers-vm]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu -chdir=tofu/modules/${{ matrix.module }} fmt -check -diff
      - run: tofu -chdir=tofu/modules/${{ matrix.module }} init -backend=false -input=false
      - run: tofu -chdir=tofu/modules/${{ matrix.module }} validate
  image:
    needs: [go, collection, tofu]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
