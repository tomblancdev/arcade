name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  # This repo is a platform anyone can run. Whoever runs it keeps their own
  # addresses, hostnames, domains and house word in their own configuration;
  # the only thing crossing between them is a pinned tag. A convention nobody
  # can forget beats one everybody means to keep, so this is a gate.
  no-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/no-environment.sh

  collection:
    needs: [no-environment]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet ansible-core
      - run: ansible-galaxy collection build ansible/ --output-path /tmp/collection
      - run: ansible-galaxy collection install /tmp/collection/tomblancdev-arcade-*.tar.gz -p /tmp/collections
      - run: ANSIBLE_COLLECTIONS_PATH=/tmp/collections ansible-galaxy collection list tomblancdev.arcade
  tofu:
    needs: [no-environment]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [screen-vm, servers-vm, appliance-vm]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu -chdir=tofu/modules/${{ matrix.module }} fmt -check -diff
      - run: tofu -chdir=tofu/modules/${{ matrix.module }} init -backend=false -input=false
      - run: tofu -chdir=tofu/modules/${{ matrix.module }} validate
